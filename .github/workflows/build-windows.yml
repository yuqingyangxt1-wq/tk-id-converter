name: build-windows

# Build the TK Philippines table converter into a single Windows .exe
# using a GitHub-hosted Windows runner. No Windows machine needed locally.

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm "TK-ID-Converter.spec"

      - name: Copy assets next to the exe
        shell: cmd
        run: |
          if not exist "dist\assets" mkdir "dist\assets"
          copy /Y "assets\batch-product-source.xlsx" "dist\assets\"
          if exist "assets\default_size_chart.png" copy /Y "assets\default_size_chart.png" "dist\assets\"

      - name: Zip the release (single-layer for easy unzip)
        shell: pwsh
        run: |
          $name = "TK-ID-Converter"
          # Wrap dist/ into a single-folder zip so Mac users can unzip once
          # and run the exe directly (no nested archive to extract again).
          if (Test-Path "$name") { Remove-Item -Recurse -Force "$name" }
          New-Item -ItemType Directory -Path "$name" | Out-Null
          Copy-Item -Recurse "dist\*" -Destination "$name"
          $zipPath = "${name}.zip"
          # Compress the whole $name directory (not "$name\*") so the zip
          # preserves the "TK-ID-Converter/" top-level folder name.
          Compress-Archive -Path "$name" -DestinationPath $zipPath -Force
          Get-ChildItem $name, $zipPath | Select-Object Name, Length

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: TK-ID-Converter-windows
          path: TK-ID-Converter.zip
          if-no-files-found: error
          retention-days: 30
